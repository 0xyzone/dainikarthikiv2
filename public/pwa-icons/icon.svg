<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#064e3b" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle Inner Ring -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Icon Graphics -->
  <g filter="url(#shadow)">
    <!-- Wallet / Vault Base Shape -->
    <rect x="110" y="150" width="292" height="220" rx="36" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M110 200 C110 166 138 150 172 150 L340 150 C374 150 402 166 402 200 L110 200 Z" fill="#ecfdf5"/>

    <!-- Upward Trend Chart Line inside -->
    <path d="M145 285 L215 225 L275 255 L350 180" fill="none" stroke="#059669" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M320 180 L350 180 L350 210" fill="none" stroke="#059669" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Small Golden Coin Badge -->
    <circle cx="360" cy="315" r="38" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="6"/>
    <!-- Currency sign in coin -->
    <text x="360" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#78350f" text-anchor="middle">रू</text>
  </g>

  <!-- App Title Acronym / Emblem Bar -->
  <circle cx="215" cy="225" r="10" fill="#10b981"/>
  <circle cx="275" cy="255" r="10" fill="#10b981"/>
</svg>
